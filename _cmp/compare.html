<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:Arial,sans-serif;font-size:12px}
table{border-collapse:collapse;margin:12px}
td,th{padding:8px 14px;text-align:center;border:1px solid #ddd}
th{font-weight:600;color:#333;font-size:11px}
.name{text-align:left;color:#444;font-weight:600}
img.s16{width:16px;height:16px;display:inline-block;vertical-align:middle}
img.s64{width:64px;height:64px;display:inline-block;image-rendering:pixelated}
.dark{background:#2b2b2b}
.dark td,.dark th{border-color:#444;color:#ccc}
h3{margin:14px 12px 0;font-size:13px}
.cap{color:#888;font-size:10px}
</style></head><body>
<h3>At true 16px (how it appears in the ribbon list)</h3>
<table id="t16"></table>
<h3>Zoomed 4× (64px) to see stroke quality</h3>
<table id="t64"></table>
<script>
var icons=['copypov','pastepov','createquickview'];
var cols=[['x100','1.0px (current)'],['x133','1.33px'],['x150','1.5px']];
function build(tid,cls,suf){
  var t=document.getElementById(tid);
  var head='<tr><th class="name">icon</th>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr>';
  var rows=icons.map(function(n){
    return '<tr><td class="name">'+n+'</td>'+cols.map(function(c){
      return '<td><img class="'+cls+'" src="/_cmp/'+n+suf+'_'+c[0]+'.svg"></td>';
    }).join('')+'</tr>';
  }).join('');
  t.innerHTML=head+rows;
}
build('t16','s16',''); build('t64','s64','');
// dark row set
document.body.insertAdjacentHTML('beforeend','<h3>Dark mode — true 16px & 4×</h3><div class="dark" style="padding:6px"><table id="t16d"></table><table id="t64d"></table></div>');
build('t16d','s16','-dark'); build('t64d','s64','-dark');
</script></body></html>
